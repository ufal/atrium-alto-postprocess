services:
  alto:
    image: ghcr.io/ufal/atrium-alto-postprocess:${ATRIUM_VERSION:-dev}
    build:
      context: .
      args:
        ATRIUM_RUNNER_IMAGE: ghcr.io/ufal/atrium-alto-postprocess:${ATRIUM_VERSION:-dev}
        ATRIUM_RUNNER_REPO: https://github.com/ufal/atrium-alto-postprocess
        ATRIUM_RUNNER_REF: ${ATRIUM_RUNNER_REF:-dev}
    environment:
      ATRIUM_RUNNER_IMAGE: ghcr.io/ufal/atrium-alto-postprocess:${ATRIUM_VERSION:-dev}
      ATRIUM_RUNNER_REPO: https://github.com/ufal/atrium-alto-postprocess
      ATRIUM_RUNNER_REF: ${ATRIUM_RUNNER_REF:-dev}
      HF_HOME: /cache/huggingface
    volumes:
      - ./data:/data
      - hf-cache:/cache/huggingface
      - alto-models:/app/models          # persists lid.176.bin (seeded from image on first run)
      - ./setup/config_langID.txt:/app/setup/config_langID.txt:ro

  # API profile — only starts with: docker compose --profile api up
  api:
    extends: alto
    profiles: ["api"]
    entrypoint: ["python", "service/text_api.py"]
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    ports:
      - "8000:8000"
    # Issue #55 container contract. The skill branch's Dockerfile is single-stage —
    # the API is this service's entrypoint override, not a build target — so the
    # healthcheck and stop signal live here rather than in the Dockerfile, where they
    # would also attach to the batch container that serves nothing. Mirrors the
    # `api` stage on the default branch; `service/healthcheck.py` is the same
    # hub-canonical probe, which had been shipping on this branch unreferenced.
    stop_signal: SIGTERM
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "/app/service/healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3

volumes:
  hf-cache:
  alto-models:
