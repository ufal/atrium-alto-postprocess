# atrium-alto-postprocess — scheduled "slow lane" smoke tests
#
# PR CI runs `pytest -m "not slow"` (hermetic, no network/models). The slow
# tests — LayoutReader / Qwen2.5 perplexity / GLM-4v and the HuggingFace
# `lid.176.bin` fetch — never run there, so upstream breakage (a moved/renamed
# HF model, a vanished revision, a LayoutReader repo move) stays invisible until
# a user hits it. This nightly job closes that gap.
#
# PARAM block is filled from this repo's docker.yml caller.

name: Scheduled Smoke Tests

# Mirrors the hub's e2e-pipeline-smoke.yml: a smoke run that is already executing is
# the one carrying the signal, so a later trigger queues rather than killing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 3 * * *"    # daily 03:00 UTC
  workflow_dispatch:

env:
  APT_PACKAGES: "build-essential g++"
  # (12-factor X) Must match docker.yml's pre-install-torch, or the nightly
  # smoke tests a torch the published image never ships.
  PRE_INSTALL_TORCH: "torch>=2.1,<3.0"
  REQUIREMENTS: "setup/requirements.txt service/requirements.txt setup/requirements-test.txt"

jobs:
  slow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write          # only used by the "open issue on failure" step below
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install APT packages
        if: env.APT_PACKAGES != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ env.APT_PACKAGES }}

      # Read the spec from the environment, never via ${{ }}. Expression substitution
      # happens BEFORE the shell sees the script, so `${{ env.PRE_INSTALL_TORCH }}`
      # wrote `pip install torch>=2.1,<3.0 …` into the script source — where `>=2.1,`
      # and `<3.0` are redirections, not part of a version spec. The step died on a
      # missing file named `3.0` having silently created one named `=2.1,`, before pip
      # ran at all (ufal/atrium-alto-postprocess run 34008513286).
      #
      # A shell expansion would be enough on its own, since bash does not re-parse
      # redirections out of an expanded value — that is why the hub's
      # docker-tool.reusable.yml survives the same spec with a bare $TORCH_SPEC. The
      # array is used here anyway because it states both requirements outright: the
      # value must word-split (page-classification passes two packages) and each word
      # must reach pip as a literal. Quoting "$PRE_INSTALL_TORCH" would satisfy only
      # the second and break the first.
      - name: Pre-install PyTorch (CPU)
        if: env.PRE_INSTALL_TORCH != ''
        run: |
          read -ra specs <<< "$PRE_INSTALL_TORCH"
          pip install "${specs[@]}" --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          for req in ${{ env.REQUIREMENTS }}; do
            if [ -f "$req" ]; then pip install -r "$req"; fi
          done
          pip install pytest pytest-cov

      - name: Run slow tests (network + models)
        env:
          PYTHONPATH: .
          HF_TOKEN: ${{ secrets.HF_TOKEN }}   # only needed by repos pulling gated models
        run: python -m pytest -m slow -v --tb=short

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = `Scheduled smoke tests failed (${new Date().toISOString().slice(0,10)})`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `The scheduled \`slow\` test run failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nLikely an upstream change (a moved/renamed HuggingFace model or revision, or the LayoutReader source repo).`,
              labels: ["ci", "upstream"],
            });
