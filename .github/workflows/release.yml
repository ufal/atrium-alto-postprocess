# atrium-alto-postprocess — automated GitHub Release
#
# On a v* tag, create a GitHub Release with auto-generated notes and attach a
# packaged service bundle. The Docker image is published separately by docker.yml.

name: Automated Release

# Never cancel a release. The trigger is a tag push, so each run has its own ref and
# overlap is only possible on a re-run of the same tag — where cancelling the first
# could leave a half-published release behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # required to create the Release

jobs:
  # ── Release gate ────────────────────────────────────────────────────────────
  # A mistagged push (tag != CITATION.cff != para_config.txt [tool] version)
  # fails HERE and blocks the release job below, so nothing gets published.
  # Same check as ufal/atrium-project security.reusable.yml's version-check —
  # both now run the SAME vendored check_version.py, so the two cannot drift
  # apart the way the old inline copies did. It stays a VENDORED FILE rather
  # than a `uses:` on purpose: the guard must not depend on a cross-repo
  # `uses: …@v1` resolving at tag-push time (that ordering gap is
  # what let this repo's own v1.0.0.-beta tag publish). Would have blocked it.
  version-guard:
    name: Verify tag == CITATION.cff == para_config.txt
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Block release on version/tag mismatch
        # Was a ~45-line inline python heredoc, duplicated verbatim across all
        # five release.yml files and again (in a drifted variant) in the hub's
        # security.reusable.yml. Now one vendored script, held byte-identical to
        # docs/templates/shared/check_version.py by para-drift.reusable.yml (#18).
        # Kept as a vendored file, not a reusable workflow: this gate must not
        # depend on a cross-repo `uses:` resolving at tag-push time.
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          python check_version.py \
            --citation CITATION.cff \
            --para-config setup/para_config.txt \
            --tag "$TAG_REF" \
            --require-tag

  release:
    needs: version-guard
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Package service artifact
        run: |
          mkdir -p atrium-service
          cp -r setup/ service/ atrium-service/ 2>/dev/null || true
          cp README.md atrium-service/ 2>/dev/null || true
          zip -r service_bundle.zip atrium-service/ -x "*/__pycache__/*" "*/.git/*"

      - name: Create GitHub Release
        # SHA-pinned: this action holds `contents: write`. A moving tag can be
        # force-pushed to malicious code -- exactly what happened to
        # aquasecurity/trivy-action in 2026-03 (GHSA-69fq-xp46-6x23). Dependabot
        # keeps the SHA and the trailing version comment in step (#18).
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3
        with:
          generate_release_notes: true
          files: |
            service_bundle.zip
